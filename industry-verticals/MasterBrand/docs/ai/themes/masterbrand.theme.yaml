  cardRadius: "0"
  imageRadius: "0"
  shadowStyle: "none"
  borderStyle: "subtle"

tone:
  overall: "premium lifestyle"
  colorMode: "light"
  contrast: "medium"
  imagery: "photography"
  heroStyle: "full-bleed-image"
  cardStyle: "image-overlay"
  navStyle: "solid-bar"

tailwind:
  colors:
    brand:
      primary: "#4F758B"
      secondary: "#2C3E4A"
      accent: "#4F758B"
  fontFamily:
    heading: ["Esteban", "Georgia", "serif"]
    body: ["Montserrat", "system-ui", "sans-serif"]
  borderRadius:
    DEFAULT: "0.25rem"
    button: "9999px"
    card: "0"

cssVariables: |
  :root {
    --brand-primary: #4F758B;
    --brand-primary-foreground: #ffffff;
    --brand-secondary: #2C3E4A;
    --brand-secondary-foreground: #ffffff;
    --brand-accent: #4F758B;
    --brand-accent-foreground: #ffffff;
    --brand-bg: #ffffff;
    --brand-fg: #212529;
    --brand-muted: #F5F4F1;
    --brand-muted-fg: #5A6570;
    --brand-header-bg: #4F758B;
    --brand-header-fg: #ffffff;
    --brand-footer-bg: #EAEAEA;
    --brand-footer-fg: #212529;
    --brand-border: #D5D8DC;
    --brand-ring: #4F758B;
    --brand-heading-font: 'Esteban', Georgia, serif;
    --brand-body-font: 'Montserrat', system-ui, sans-serif;
    --brand-radius: 0.25rem;
    --brand-button-radius: 9999px;
    --brand-card-radius: 0;
  }

extraction:
  confidence: "high"
  method: "playwright-full + screenshot"
  notes:
    - "Primary slate-blue #4F758B from header/button computed styles (rgb 79,117,139)."
    - "Headings use Esteban (serif); body/nav use Montserrat (sans). Both on Google Fonts."
    - "Proprietary Museo Sans present on live site — substituted with Montserrat for demo."
    - "Hero CTAs are pill ghost buttons (white border, transparent fill)."
    - "Cards mostly use image overlays with white text; some cards have white text panels below."
    - "Brand wall is dark charcoal (#3A3A3A) with white logos."
    - "Utility bar is near-black (#2C2C2C); main nav is solid primary blue."
    - "Muted section backgrounds are warm off-white (#F5F4F1), not cool gray."
