  headingWeight: "400"
  bodyFamily: "'Montserrat', system-ui, sans-serif"
  bodyWeight: "400"
  monoFamily: "ui-monospace, monospace"
  googleFontsUrl: "https://fonts.googleapis.com/css2?family=Esteban&family=Montserrat:ital,wght@0,400;0,500;0,700;1,300&display=swap"
  scale:
    hero: "3.5rem"
    h1: "2.25rem"
    h2: "2rem"
    h3: "1.75rem"
    body: "1rem"
    small: "0.875rem"
  headingTransform: "none"
  letterSpacing: "normal"
  lineHeight: "relaxed"

spacing:
  density: "comfortable"
  sectionGap: "4rem"
  containerMaxWidth: "1200px"
  containerPadding: "1.5rem"

shape:
