      matchConfidence: "high"
      apiAddable: true
      variantMatch: "none"
    sectionBackground: "muted"
    content:
      Title: "Featured Competition Leaders"
    contentNotes: "Sports ranking tables — no template equivalent"
    customVariantNeeded: null

  - position: 15
    description: "Inspire a Million More Girls — purple full-width CTA with Donate/Learn More"
    matchedComponent:
      registryId: "cta-banner"
      manifestName: "CTABanner"
      variant: "WithImage"
      matchType: "template"
