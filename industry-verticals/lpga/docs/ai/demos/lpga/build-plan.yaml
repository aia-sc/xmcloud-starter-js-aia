      PrimaryLink: { text: "View Schedule", href: "https://www.lpga.com/tournaments" }
    contentNotes: "Solid green/brand accent banner"
    variantReason: "Centered text + single CTA on colored background"

  - position: 7
    description: "From the Tour — video thumbnail grid (4-up) with play icons, titles, timestamps"
    matchedComponent:
      registryId: "feature-cards-grid"
      manifestName: "FeatureCardsGrid"
      variant: "WithImages"
      matchType: "template"
      matchConfidence: "medium"
      apiAddable: true
      variantMatch: "partial"
    sectionBackground: "default"
    content:
      Title: "From the Tour"
    contentNotes: "Video play overlays — Phase 5.5 LpgaVideo variant; videos metadata-only"
    variantReason: "Image-top cards in multi-column grid"
    customVariantNeeded:
      name: "LpgaVideoGrid"
      description: "4-column video cards with play icon, duration, HIGHLIGHTS tag, relative time"
      parentComponent: "FeatureCardsGrid"

  - position: 8
    description: "Press conferences — larger 2–3 column video thumbnails of players at microphones"
    matchedComponent:
      registryId: "feature-cards-grid"
      manifestName: "FeatureCardsGrid"
      variant: "TwoColumn"
      matchType: "template"
      matchConfidence: "medium"
      apiAddable: true
      variantMatch: "partial"
    sectionBackground: "muted"
    content:
      Title: "Press Conferences"
    contentNotes: "Reuse FeatureCardsGrid with TwoColumn; custom LpgaPress variant if needed"
    variantReason: "Fewer, wider cards"

  - position: 9
    description: "Explore the LPGA — 6 white cards (Epson Tour, Amateurs, Professionals, Foundation, Girls Golf, Schools)"
    matchedComponent:
      registryId: "value-proposition-grid"
      manifestName: "ValuePropositionGrid"
      variant: "Default"
      matchType: "template"
      matchConfidence: "high"
      apiAddable: true
      variantMatch: "partial"
    sectionBackground: "muted"
    content:
