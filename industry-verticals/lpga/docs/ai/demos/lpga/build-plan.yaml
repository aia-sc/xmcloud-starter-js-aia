    matchedComponent:
      registryId: "cta-banner"
      manifestName: "CTABanner"
      variant: "WithImage"
      matchType: "template"
      matchConfidence: "high"
      apiAddable: true
      variantMatch: "exact"
    sectionBackground: "secondary"
    content:
