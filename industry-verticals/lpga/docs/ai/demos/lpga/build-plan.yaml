    contentNotes: "May be two stacked dark banners — can use two FeatureHighlight datasources or one CTABanner"
    variantReason: "Centered text on dark full-width band"

  - position: 11
    description: "Founding Partners — logo cards with short descriptive blurbs (Rolex, CME, etc.)"
    matchedComponent:
      registryId: "logo-cloud"
      manifestName: "LogoCloud"
      variant: "WithLabels"
      matchType: "template"
      matchConfidence: "high"
      apiAddable: true
      variantMatch: "partial"
