    contentNotes: "Logo + short blurb + plus affordance per card"
    variantReason: "3x2 icon/logo + text grid"
    customVariantNeeded:
      name: "LpgaExplore"
      description: "White cards with org logos, short description, plus icon"
      parentComponent: "ValuePropositionGrid"

  - position: 10
    description: "LPGA Drive On / Hall of Fame dark navy brand mission banners"
    matchedComponent:
      registryId: "feature-highlight"
      manifestName: "FeatureHighlight"
      variant: "Centered"
      matchType: "template"
      matchConfidence: "medium"
      apiAddable: true
      variantMatch: "partial"
    sectionBackground: "dark"
    content:
