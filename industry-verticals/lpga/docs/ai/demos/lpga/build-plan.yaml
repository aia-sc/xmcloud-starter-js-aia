# Demo Build Plan — LPGA Homepage
client:
  name: "LPGA"
  sourceUrl: "https://www.lpga.com"
  themeFile: "docs/ai/themes/lpga.theme.yaml"
  analyzedAt: "2026-10-16T15:10:00Z"
  targetPage: "Home"
  contentRoot: "/sitecore/content/sports/lpga"
  codeRoot: "industry-verticals/lpga"
  notes: >
    uiim template React/Sitecore items are not present in this environment.
    Template matches in this plan are the intended registry mapping; Phase 5 will
    implement missing components as LPGA custom (Erlanger pattern) under
    Project/Financial renderings + sports/lpga content, uploading assets to Content Hub.

pageAnalysis:
  screenshotFiles:
    desktop: "docs/ai/demos/lpga/screenshot-desktop.png"
    hero: "docs/ai/demos/lpga/screenshot-hero.png"
    userReference: "docs/ai/demos/lpga/homepage-reference.jpg"
    articleSavedForLater: "docs/ai/demos/lpga/reference/article-how-to-watch-shanghai.jpg"
  totalSections: 16
  templateMatches: 12
  customRequired: 4

sections:
  - position: 1
    description: "Thin Impact Award / Impact promo banner with golfer photo, logo, and Donate/Winner CTA"
    matchedComponent:
      registryId: "announcement-bar"
      manifestName: "AnnouncementBar"
      variant: "Highlight"
      matchType: "template"
      matchConfidence: "high"
      apiAddable: true
      variantMatch: "partial"
    sectionBackground: "primary"
    content:
      Message: "Brooke Henderson — 2026 Impact Award Winner"
      BarLink: { text: "Learn more", href: "https://www.lpga.com" }
    contentNotes: "Full-bleed photo strip; AnnouncementBar is thinner — Phase 5.5 Lpga variant can deepen visual"
    variantReason: "High-contrast promotional strip at very top"
    customVariantNeeded:
      name: "LpgaImpact"
      description: "Full-width photo promo strip with Impact logo left, athlete photo, winner title"
      parentComponent: "AnnouncementBar"

  - position: 2
    description: "Main nav — LPGA logo, Tour/Leaderboard/Schedule/Athletes/Stats/News, search, Rolex clock block"
    matchedComponent:
      registryId: "navigation-header"
      manifestName: "NavigationHeader"
      variant: "Default"
      matchType: "template"
      matchConfidence: "high"
      apiAddable: false
      variantMatch: "partial"
    sectionBackground: "default"
    content:
      CtaLabel: "LIVE"
      navLinks: ["LIVE", "Leaderboard", "Schedule", "Athletes", "Stats", "News & Video"]
    contentNotes: "Utility nav (Tours/Partners/Learn) sits above; Rolex sponsor clock is distinctive — custom variant"
    variantReason: "Solid white bar with navy text (tone.navStyle: solid-bar)"
    customVariantNeeded:
      name: "Lpga"
      description: "White main nav + dark utility bar + LIVE green pill + Rolex clock sponsor block"
      parentComponent: "NavigationHeader"

  - position: 3
    description: "LIVE tournament band (Buick LPGA Shanghai) with dates, location, weather, View Leaderboard / How to Watch CTAs, horizontal player score cards"
    matchedComponent:
      registryId: ""
      manifestName: "LpgaTournamentLeaderboard"
      variant: "Default"
      matchType: "custom"
      matchConfidence: "high"
      apiAddable: true
      variantMatch: "none"
    sectionBackground: "dark"
    content:
      Title: "Buick LPGA Shanghai"
      Dates: "Oct 15 - Oct 18, 2026"
      Location: "Shanghai, People's Republic of China"
      PrimaryCta: "VIEW LEADERBOARD"
      SecondaryCta: "HOW TO WATCH"
    contentNotes: "Live scores + player cards with Favorite — no template covers this sports pattern"
    customVariantNeeded: null

  - position: 4
    description: "Featured news hero — large story image + headline left; Top News sidebar list right; smaller story thumbnails below"
    matchedComponent:
      registryId: ""
      manifestName: "LpgaFeaturedNews"
      variant: "Default"
      matchType: "custom"
      matchConfidence: "high"
      apiAddable: true
      variantMatch: "none"
    sectionBackground: "default"
    content:
      Title: "Featured tournament news"
      PrimaryHeadline: "Lead story with athlete photo"
    contentNotes: "Asymmetric news layout — do not force into HeroBanner alone"
    customVariantNeeded: null

  - position: 5
    description: "Tour Highlights — horizontal row of tall portrait video/photo cards with athlete names"
    matchedComponent:
      registryId: "feature-cards-grid"
      manifestName: "FeatureCardsGrid"
      variant: "Carousel"
      matchType: "template"
      matchConfidence: "high"
      apiAddable: true
      variantMatch: "partial"
    sectionBackground: "default"
    content:
      Title: "Tour Highlights"
    contentNotes: "Portrait cards with HIGHLIGHTS tags; carousel on live site"
    variantReason: "Horizontal scrolling portrait cards"
    customVariantNeeded:
      name: "LpgaHighlights"
      description: "Tall portrait cards with yellow HIGHLIGHTS tag and athlete name overlay"
      parentComponent: "FeatureCardsGrid"

  - position: 6
    description: "Bright green full-width Tour Schedule CTA banner"
    matchedComponent:
      registryId: "cta-banner"
      manifestName: "CTABanner"
      variant: "Default"
      matchType: "template"
      matchConfidence: "high"
      apiAddable: true
      variantMatch: "exact"
    sectionBackground: "accent"
    content:
