customComponents:
  - name: "LpgaTournamentLeaderboard"
    position: 3
    reason: "Live tournament header + player score carousel unique to sports sites"
    suggestedFields:
      - Title
      - Dates
      - Location
      - WeatherText
      - PrimaryLink
      - SecondaryLink
      - children: [Rank, PlayerName, Country, Photo, TotalScore, Thru, FavoriteLabel]
    approach: "Create list component under Project/Financial + Data folder under sports/lpga"

  - name: "LpgaFeaturedNews"
    position: 4
    reason: "Asymmetric featured story + Top News sidebar + secondary thumbnails"
    suggestedFields:
      - Title
      - FeaturedImage
      - FeaturedHeadline
      - FeaturedLink
      - children: [Headline, Summary, Link]  # sidebar + secondary
    approach: "Custom list component; avoid forcing HeroBanner"

  - name: "LpgaStandings"
    position: 14
    reason: "Dual ranking tables (CME Globe / Rolex POY) or player comparison stats"
    suggestedFields:
      - LeftTitle
      - RightTitle
      - children: [PlayerName, Photo, Rank, Points, Events, Wins, Top10]
    approach: "Custom list component with two parent groups or two sibling datasources"

buildOrder:
  phase1_sitecore:
    - AnnouncementBar
    - NavigationHeader  # manual / partial
    - LpgaTournamentLeaderboard  # custom
    - LpgaFeaturedNews  # custom
    - FeatureCardsGrid  # Tour Highlights
    - CTABanner  # Schedule
    - FeatureCardsGrid  # From the Tour videos
    - FeatureCardsGrid  # Press conferences
    - ValuePropositionGrid  # Explore
    - FeatureHighlight  # Drive On / Hall of Fame
    - LogoCloud  # Partners
    - FeatureCardsGrid  # Trending/Social
    - CTABanner  # App
    - LpgaStandings  # custom
    - CTABanner  # Inspire
    - NewsletterSignup
    - SiteFooter  # manual / partial
  phase2_theme: "Inline LPGA :root CSS variables into globals.css + Figtree/Roboto Serif fonts"
  phase3_custom:
    - LpgaTournamentLeaderboard
    - LpgaFeaturedNews
    - LpgaStandings
  phase5_5_candidates:
    - AnnouncementBar → LpgaImpact
    - NavigationHeader → Lpga
    - FeatureCardsGrid → LpgaHighlights / LpgaVideoGrid / LpgaSocial
    - ValuePropositionGrid → LpgaExplore
    - LogoCloud → LpgaPartners
    - SiteFooter → Lpga
