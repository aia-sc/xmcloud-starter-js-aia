      matchConfidence: "high"
      apiAddable: false
      variantMatch: "partial"
    sectionBackground: "dark"
    content:
      BrandLogo: "LPGA logo white"
    contentNotes: "Context-only — partial design / manual placement"
    variantReason: "Extensive multi-column footer with social + apps"
    customVariantNeeded:
      name: "Lpga"
