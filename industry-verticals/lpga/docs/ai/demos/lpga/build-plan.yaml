    matchedComponent:
      registryId: "feature-cards-grid"
      manifestName: "FeatureCardsGrid"
      variant: "Carousel"
      matchType: "template"
      matchConfidence: "low"
      apiAddable: true
      variantMatch: "none"
    sectionBackground: "default"
    content:
      Title: "See Who's Trending"
    contentNotes: "Circular story bubbles — weak template fit; prefer custom LpgaSocialStories OR Phase 5.5 circular carousel"
    variantReason: "Horizontal scroll of people cards"
    customVariantNeeded:
      name: "LpgaSocial"
      description: "Circular Instagram-style player story bubbles with names"
      parentComponent: "FeatureCardsGrid"

  - position: 13
